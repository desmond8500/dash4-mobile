name: APK Android

# Construit l'application Android à chaque push sur main (ou à la demande) et la publie dans la release
# « android-latest » : https://github.com/desmond8500/dash4-mobile/releases/tag/android-latest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.dash4.yonkou.info/api
      BUILD_NUMBER: ${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: ImageMagick (icônes)
        run: command -v magick || command -v convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)

      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: bash scripts/android-prepare.sh

      # Sans clé fournie : APK signé avec une clé de débogage gardée en cache, pour que les mises à jour
      # s'installent par-dessus la version précédente
      - uses: actions/cache@v4
        if: env.SIGNED != '1'
        with:
          path: ~/.android/debug.keystore
          key: dash4-android-debug-keystore

      - name: Compilation
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${SIGNED:-}" = "1" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
          mkdir -p ../out
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          cp "$APK" "../out/dash4-$VERSION_NAME.apk"
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: dash4-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Publication (release android-latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/*.apk \
            --title "Dash4 Android $VERSION_NAME" \
            --notes "Application mobile Dash4 $VERSION_NAME, construite depuis ${GITHUB_SHA::7}. Télécharger le fichier .apk sur le téléphone puis l'ouvrir pour l'installer (autoriser l'installation depuis cette source)." \
            --target "$GITHUB_SHA" \
            --latest
